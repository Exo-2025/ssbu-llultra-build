
name: Build SSBU Online Deluxe (Skyline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -e
          unzip -q ssbu-online-deluxe-1.4.3-llultra-native-resolution-source.zip -d source
          echo "PROJECT_DIR=$(find source -name Cargo.toml -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-skyline
        run: cargo install cargo-skyline --locked

      - name: Install Skyline standard library
        run: cargo skyline update-std

      - name: Build plugin
        run: cargo skyline build --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: ssbu-online-deluxe-llultra-build
          path: ${{ env.PROJECT_DIR }}/target/aarch64-skyline-switch/release/libssbu_online_deluxe.nro
          if-no-files-found: error
